name: Extract FMG project

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract FMG project
        run: |
          unzip -o FMG_OFFICIAL_VERCEL_UPLOAD.zip -d extracted
          cp -r extracted/app .
          cp -r extracted/lib .
          cp -r extracted/supabase .
          cp extracted/package.json .
          cp extracted/next-env.d.ts .
          cp extracted/tsconfig.json .
          cp extracted/vercel.json .
          cp extracted/README.md .
          cp extracted/SETUP_FMG.md .
          cp extracted/.env.example .
          rm -rf extracted
          rm -f FMG_OFFICIAL_VERCEL_UPLOAD.zip

      - name: Commit extracted project
        run: |
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Add FMG Next.js project"
          git push
